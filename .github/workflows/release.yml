name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Check the release version
        env:
          RPS_RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os, pathlib, tomllib; version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; assert os.environ['RPS_RELEASE_TAG'] == 'v' + version"
      - name: Install the handout typesetter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Test and build artifacts
        run: |
          uv sync --locked --python 3.12
          uv run ruff check
          uv run pytest
          uv run --locked --script workshop/build_handouts.py
          uv build
          uv run --script workshop/smoke_install.py
          uv run --locked --script workshop/build_bundle.py
          sh workshop/smoke_bundle.sh output/rps-event-kit
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: RPS workshop kit ${{ github.ref_name }}
          body_path: workshop/release-notes-${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            output/pdf/*.pdf
            output/rps-event-kit.zip
