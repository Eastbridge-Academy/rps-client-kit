name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install the handout typesetter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Test and build artifacts
        run: |
          uv sync --locked --python 3.12 --group workshop
          uv run ruff check
          uv run pytest
          uv run --group workshop python workshop/build_handouts.py
          uv build
          uv run python workshop/build_bundle.py
          sh workshop/smoke_bundle.sh output/rps-event-kit
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            output/pdf/*.pdf
            output/rps-event-kit.zip
